name: Mise a jour mediatheque

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: "Indian/Reunion"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-media:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mettre a jour la mediatheque
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python automation/update_media.py

      - name: Publier les changements
        run: |
          if git diff --quiet; then
            echo "Aucune nouvelle video."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-media-data.js
          git commit -m "Mise a jour automatique de la mediatheque"
          git push
