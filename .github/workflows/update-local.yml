name: Mise a jour actualites Reunion

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-local:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: pip install requests beautifulsoup4

      - name: Mettre a jour les actualites locales
        run: python automation/update_local.py

      - name: Publier les changements
        run: |
          if git diff --quiet; then
            echo "Aucune nouvelle publication locale."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add local-auto-data.js
          git commit -m "Mise a jour automatique des actualites Reunion"
          git push
